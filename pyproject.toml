[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "codehead"
version = "0.1.0"
description = "A local event-driven software development workshop"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.7",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "SQLAlchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "uvicorn==0.54.0",
    "websockets==17.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx2==2.16.0", "ruff==0.17.5"]

[tool.setuptools.packages.find]
where = ["apps/backend/src"]

[tool.pytest.ini_options]
testpaths = ["apps/backend/tests"]
pythonpath = ["apps/backend/src"]
addopts = "-ra"
markers = ["integration: requires an isolated PostgreSQL test database"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["apps/backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
